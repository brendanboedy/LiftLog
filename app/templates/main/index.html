{% extends "base.html" %}

{% block content %}
  <div class="hero">
  <p class="eyebrow">Welcome to LiftLog</p>
  <h1>Show up.<br>Get stronger.</h1>
  <p>Plan your workouts, log every set, and watch your progress.</p>
  {% if current_user.is_authenticated %}
    <p><a class="button" href="{{ url_for('main.dashboard') }}">Go to my LiftLog</a></p>
  {% else %}
    <p>
      <a class="button" href="{{ url_for('auth.register') }}">Create an account</a>
      <a href="{{ url_for('auth.login') }}">or log in</a>
    </p>
  {% endif %}
  </div>
{% endblock %}
