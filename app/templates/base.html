<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Makes the page fit phone screens (NFR: usable on a 375px-wide phone) -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LiftLog{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="{{ url_for('main.index') }}">LiftLog</a>
    <nav class="nav">
      {% if current_user.is_authenticated %}
        <a href="{{ url_for('main.dashboard') }}">{{ current_user.username }}</a>
        <!-- Log out is a small form (not a link) so it can carry a CSRF token -->
        <form class="inline" method="post" action="{{ url_for('auth.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="link-button">Log out</button>
        </form>
      {% else %}
        <a href="{{ url_for('auth.login') }}">Log in</a>
        <a href="{{ url_for('auth.register') }}">Register</a>
      {% endif %}
    </nav>
  </header>

  <main class="container">
    <!-- Short messages from the server, e.g. "Account created" or "Wrong password" -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
